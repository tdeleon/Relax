name: Build & Test

on: [push]

jobs:
  
  build-xcode:
    strategy:
      fail-fast: false
      matrix:
       os: [macos-latest]
       destination: ["platform=macOS,name=My Mac"]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: SPM Cache
      uses: actions/cache@v5
      with:
        path: /Users/runner/Library/Developer/Xcode/DerivedData/**/SourcePackages/checkouts
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Checkout
      uses: actions/checkout@v6

    - name: Build
      run: xcodebuild -scheme Relax-Package -destination '${{ matrix.destination }}' build-for-testing
      
    - name: Test
      run: xcodebuild -scheme Relax-Package -destination '${{ matrix.destination }}' test-without-building

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-latest]
        swift: ["6.0.3"]
    runs-on: ${{ matrix.os }}

    steps:
    - if: ${{ (runner.os == 'Windows') }}
      name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Setup Swift Version
      uses: SwiftyLab/setup-swift@latest
      with:
        swift-version: ${{ matrix.swift }}

    - name: SPM Cache
      uses: actions/cache@v5
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Get Swift Version
      run: swift --version

    - name: Checkout
      uses: actions/checkout@v6
      
    - name: Build
      run: swift build
      
    - name: Test
      run: swift test
